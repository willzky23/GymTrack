<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/treinos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Treinos - GymTrack</title>
</head>
<body>
    <div class="container-aplicacao">
        <aside class="barra-lateral">
            <div class="topo-barra-lateral">
                <div class="marca">
                    <div class="caixa-logo">
                        <img src="img/Group.svg" alt="GymTrack Logo">
                    </div>
                    <span>GymTrack</span>
                </div>

                <nav class="menu-navegacao">
                    <a href="home.html" class="item-navegacao">Início</a>
                    <a href="treinos.html" class="item-navegacao ativo">Treinos</a>
                    <a href="#" class="item-navegacao">Sua evolução</a>
                    <a href="#" class="item-navegacao">Perfil</a>
                </nav>
            </div>

            <div class="rodape-barra-lateral">
                <a href="login.html" class="item-navegacao sair">Sair</a>
            </div>
        </aside>
        <main class="conteudo-principal">
            <header class="cabecalho">
                <h1>Seus <span>Treinos</span></h1>
            </header>

            
            <section class="lista-treinos">
                <article class="card-treino">
                    <div class="bloco-dia">Seg</div>
                    <div class="info-treino">
                        <h3>Peito e triceps</h3>
                        <p>6 exercícios</p>
                    </div>
                </article>

                <article class="card-treino">
                    <div class="bloco-dia">Ter</div>
                    <div class="info-treino">
                        <h3>Costa e biceps</h3>
                        <p>6 exercícios</p>
                    </div>
                </article>

                <article class="card-treino">
                    <div class="bloco-dia">Qua</div>
                    <div class="info-treino">
                        <h3>Pernas</h3>
                        <p>6 exercícios</p>
                    </div>
                </article>


                <article class="card-treino">
                    <div class="bloco-dia">Sex</div>
                    <div class="info-treino">
                        <h3>Upper body</h3>
                        <p>5 exercícios</p>
                    </div>
                </article>

                <article class="card-treino">
                    <div class="bloco-dia">Sab</div>
                    <div class="info-treino">
                        <h3>Lower</h3>
                        <p>6 exercícios</p>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
